[project]
name = "kalshi-data-stats"
version = "0.1.0"
description = "Local historical Kalshi misprediction dashboard"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1.3",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "polars>=1.18.0",
  "pydantic>=2.10.4",
  "pytz>=2024.2",
  "python-dotenv>=1.0.1",
  "python-dateutil>=2.9.0",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = ["pytest>=8.3.4", "pytest-asyncio>=0.25.0", "ruff>=0.8.4"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
