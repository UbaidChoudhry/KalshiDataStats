name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --dev
      - run: npm ci --prefix frontend
      - run: uv run ruff check backend
      - run: uv run pytest -q
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: |
          KALSHI_SYNC_MODE=demo KALSHI_DATA_DIR=/tmp/kalshi-openapi-ci uv run uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          npm --prefix frontend run check:api
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
